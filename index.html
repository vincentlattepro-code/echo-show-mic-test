<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test Micro Echo Show 15</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #10131a;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    font-size: 32px;
}

.status {
    font-size: 26px;
    font-weight: bold;
    margin: 25px;
}

.timer {
    font-size: 48px;
    font-weight: bold;
    margin: 20px;
}

button {
    font-size: 24px;
    padding: 18px 30px;
    margin: 10px;
    border-radius: 15px;
    border: none;
    cursor: pointer;
}

#start {
    background: #4CAF50;
    color: white;
}

#stop {
    background: #d9534f;
    color: white;
}

.meter {
    width: 100%;
    height: 45px;
    background: #333;
    border-radius: 15px;
    overflow: hidden;
    margin: 30px 0;
}

#level {
    width: 0%;
    height: 100%;
    background: #4CAF50;
}

.info {
    font-size: 20px;
    margin: 15px;
}

#log {
    text-align: left;
    background: #1d222d;
    padding: 15px;
    border-radius: 10px;
    min-height: 120px;
    margin-top: 25px;
    font-family: monospace;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎤 Test stabilité Micro</h1>
<p>Echo Show 15 / Amazon Silk</p>

<div id="status" class="status">
⚪ Micro non démarré
</div>

<div id="timer" class="timer">
00:00:00
</div>

<button id="start">Activer le microphone</button>
<button id="stop" disabled>Arrêter</button>

<h2>Niveau sonore</h2>

<div class="meter">
    <div id="level"></div>
</div>

<div class="info">
Interruptions détectées :
<strong id="interruptions">0</strong>
</div>

<div class="info">
Dernier signal audio :
<strong id="lastSignal">—</strong>
</div>

<h2>Journal</h2>

<div id="log"></div>

</div>

<script>

let stream;
let audioContext;
let analyser;
let microphone;
let timerInterval;
let startTime;
let interruptions = 0;
let animationId;

const statusEl = document.getElementById("status");
const timerEl = document.getElementById("timer");
const levelEl = document.getElementById("level");
const logEl = document.getElementById("log");
const interruptionEl = document.getElementById("interruptions");
const lastSignalEl = document.getElementById("lastSignal");

function log(message) {
    const time = new Date().toLocaleTimeString();
    logEl.innerHTML =
        "[" + time + "] " + message + "<br>" + logEl.innerHTML;
}

function updateTimer() {

    const elapsed = Date.now() - startTime;

    const hours =
        Math.floor(elapsed / 3600000);

    const minutes =
        Math.floor((elapsed % 3600000) / 60000);

    const seconds =
        Math.floor((elapsed % 60000) / 1000);

    timerEl.textContent =
        String(hours).padStart(2,"0") + ":" +
        String(minutes).padStart(2,"0") + ":" +
        String(seconds).padStart(2,"0");
}

async function startMicrophone() {

    try {

        log("Demande d'accès au microphone...");

        stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        statusEl.textContent =
            "🟢 MICRO ACTIF";

        log("Microphone autorisé et flux audio ouvert.");

        startTime = Date.now();

        timerInterval =
            setInterval(updateTimer,1000);

        document.getElementById("start").disabled = true;
        document.getElementById("stop").disabled = false;

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        analyser =
            audioContext.createAnalyser();

        microphone =
            audioContext.createMediaStreamSource(stream);

        microphone.connect(analyser);

        analyser.fftSize = 256;

        const dataArray =
            new Uint8Array(analyser.frequencyBinCount);

        const track =
            stream.getAudioTracks()[0];

        track.onended = function() {

            interruptions++;

            interruptionEl.textContent =
                interruptions;

            statusEl.textContent =
                "🔴 MICRO COUPÉ";

            log("ALERTE : piste microphone interrompue.");
        };

        track.onmute = function() {

            interruptions++;

            interruptionEl.textContent =
                interruptions;

            statusEl.textContent =
                "🟠 MICRO MUET";

            log("ALERTE : microphone mis en sourdine.");
        };

        track.onunmute = function() {

            statusEl.textContent =
                "🟢 MICRO ACTIF";

            log("Microphone réactivé.");
        };

        function analyse() {

            analyser.getByteFrequencyData(dataArray);

            let sum = 0;

            for(let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }

            const average =
                sum / dataArray.length;

            const percent =
                Math.min(100, average * 2);

            levelEl.style.width =
                percent + "%";

            if(average > 5) {

                lastSignalEl.textContent =
                    new Date().toLocaleTimeString();
            }

            animationId =
                requestAnimationFrame(analyse);
        }

        analyse();

    }

    catch(error) {

        statusEl.textContent =
            "🔴 ACCÈS MICRO IMPOSSIBLE";

        log(
            "ERREUR : " +
            error.name +
            " - " +
            error.message
        );
    }
}

function stopMicrophone() {

    if(stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );
    }

    if(audioContext) {
        audioContext.close();
    }

    clearInterval(timerInterval);

    cancelAnimationFrame(animationId);

    statusEl.textContent =
        "⚪ Micro arrêté";

    levelEl.style.width =
        "0%";

    document.getElementById("start").disabled = false;
    document.getElementById("stop").disabled = true;

    log("Test arrêté manuellement.");
}

document
.getElementById("start")
.addEventListener(
    "click",
    startMicrophone
);

document
.getElementById("stop")
.addEventListener(
    "click",
    stopMicrophone
);

log("Page chargée. Prêt pour le test.");

</script>

</body>
</html>
